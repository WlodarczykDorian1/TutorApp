name: Django Tests

on:
  workflow_run:
    workflows: ["Lint"]
    types:
        - completed
    branches: [ "main", "master" ]

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
#    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: Run Tests
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION}}-${{ hashFiles('**/poetry.lock') }}
#          restore-keys: |
#            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
#            venv-${{ runner.os }}-py3.13-

      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with dev

      - name: Run Django Tests
        run: |
          cd TutorApp
          poetry run coverage run --source="." manage.py test --parallel --keepdb
          poetry run coverage report -m
          poetry run coverage xml
          poetry run coverage html
        env:
          PG_USER: ${{ env.DB_USER }}
          PG_NAME: ${{ env.DB_NAME }}
          PG_PORT: ${{ env.DB_PORT }}
          PG_HOST: ${{ secrets.DB_HOST }}
          PG_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: test-secret-key
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
          DEBUG: env.DEBUG
          YOUTUBE_API_KEY: env.YOUTUBE_API_KEY

      - name: Test summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            echo "Tests completed with coverage report"
          else
            echo "Tests failed or coverage report not generated"
          fi
